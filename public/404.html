  <style>
    :root {
      color-scheme: dark;
      --neon: #00ff41;
      --neon-glow: rgba(0, 255, 65, 0.4);
      --neon-glow-strong: rgba(0, 255, 65, 0.7);
      --bg: #000000;
      --card: #0a0a0a;
      --card-border: #1a1a1a;
      --text: #e0e0e0;
      --text-dim: #666666;
      --mono: 'Share Tech Mono', 'SF Mono', 'Fira Code', monospace;
      --display: 'Orbitron', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.015) 2px, rgba(0,255,65,0.015) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    .logo-svg {
      height: 64px;
      filter: drop-shadow(0 0 8px var(--neon-glow-strong)) drop-shadow(0 0 20px var(--neon-glow));
      margin-bottom: 24px;
    }
    h1 {
      font-family: var(--display);
      font-size: 5rem;
      font-weight: 900;
      color: var(--neon);
      text-shadow: 0 0 10px var(--neon-glow), 0 0 30px var(--neon-glow), 0 0 60px var(--neon-glow);
      letter-spacing: 8px;
      line-height: 1;
    }
    .subtitle {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text-dim);
      margin-top: 12px;
      letter-spacing: 2px;
    }
    .divider {
      width: 300px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      box-shadow: 0 0 10px var(--neon-glow), 0 0 20px var(--neon-glow);
      margin: 32px auto;
      opacity: 0.6;
    }
    .message {
      font-size: 0.85rem;
      color: var(--text-dim);
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: 1px solid var(--neon);
      border-radius: 2px;
      color: var(--neon);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      min-height: 44px;
    }
    .back-link:hover {
      background: rgba(0, 255, 65, 0.1);
      box-shadow: 0 0 10px var(--neon-glow);
    }
    .back-link:active { transform: scale(0.97); }
    .social {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }
    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .social a:hover {
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 10px var(--neon-glow);
    }
    .social a svg { width: 16px; height: 16px; fill: currentColor; }
    .footer {
      position: fixed;
      bottom: 20px;
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  </style>
</head>
